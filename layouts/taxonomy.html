{{ define "main" }}
<header class="list-head">
  <h1>Tags</h1>
  <p class="lede">Every topic I've written about.</p>
</header>
<ul class="tag-cloud">
  {{ range .Data.Terms.Alphabetical }}<li><a href="{{ .Page.RelPermalink }}">#{{ .Page.Title | lower }}<span>{{ .Count }}</span></a></li>{{ end }}
</ul>
{{ end }}
