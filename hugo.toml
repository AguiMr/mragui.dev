baseURL = "https://mragui.dev/"
languageCode = "en"
title = "MrAgui"
enableRobotsTXT = true
ignoreLogs = ["warning-goldmark-raw-html"]

[params]
  description = "Hardware tinkering, firmware and side projects."
  github = "https://github.com/AguiMr"

[menus]
  [[menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 1
  [[menus.main]]
    name = "Projects"
